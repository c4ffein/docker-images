name: Build nginx-acme

on:
  push:
    branches:
      - main
    paths:
      - 'nginx/**'
      - 'Makefile'
      - '.github/workflows/build-nginx.yml'
  pull_request:
    paths:
      - 'nginx/**'
      - 'Makefile'
      - '.github/workflows/build-nginx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built here rather than with `make nginx-build` so the GitHub Actions
      # layer cache is used and the arm64 variant can be built. The tag matches
      # what the Makefile expects.
      - name: Build Docker image (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          platforms: ${{ matrix.platform }}
          push: false
          tags: nginx-acme:latest
          load: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The tests live in the Makefile (nginx/test/run-smoke.sh) so local runs
      # and CI check the same thing: module present and loaded, shipped config
      # and an acme_certificate server block parse, HTTP served, container
      # healthy.
      - name: Test image
        run: make nginx-test

  e2e:
    name: End-to-end ACME issuance
    runs-on: ubuntu-latest
    # amd64 only: this runs a real ACME exchange against a local Pebble server,
    # which is slow enough under QEMU to be flaky.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Issue a certificate from a local ACME server
        run: make nginx-e2e
