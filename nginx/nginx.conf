# Load the ACME module (installed from nginx.org's apk repository, see Dockerfile).
load_module /usr/lib/nginx/modules/ngx_http_acme_module.so;

# No `user` directive: the whole process tree already runs as uid 101 (nginx),
# see Dockerfile. The pid file and every temp path live under /tmp because
# that is the only writable location when the container runs with
# --read-only and a tmpfs on /tmp.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    ##
    # ACME (automatic Let's Encrypt certificates)
    ##

    # Required by the ACME module to reach the ACME server: nginx does not use
    # the system resolver for runtime lookups.
    # Public resolvers on purpose: Docker's embedded DNS (127.0.0.11) does not
    # exist when the container runs with --network host, which is how the
    # systemd unit runs it. Three different operators (Cloudflare, Google,
    # Quad9) so that one of them being down does not stop certificate renewal.
    # Override here if you run your own resolver.
    resolver 1.1.1.1 8.8.8.8 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # Issuers. Nothing happens until a server block references one with
    # `acme_certificate`, so both can stay defined.
    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;
        state_path /var/nginx-acme/letsencrypt;
        accept_terms_of_service;
        # Optional, and close to pointless with Let's Encrypt today: they
        # stopped sending expiration notification emails on 2025-06-04, on
        # purpose, so as not to retain subscriber addresses. Left commented out
        # so nobody deploys a copy of this file that registers an ACME account
        # under someone else's address.
        # contact mailto:you@example.com;
    }

    # Use this one while testing. Its certificates are NOT trusted by browsers,
    # but it has far looser rate limits than production Let's Encrypt.
    acme_issuer letsencrypt_staging {
        uri https://acme-staging-v02.api.letsencrypt.org/directory;
        state_path /var/nginx-acme/letsencrypt-staging;
        accept_terms_of_service;
    }

    acme_shared_zone zone=ngx_acme_shared:1M;

    # Default server. A listener on port 80 is required for HTTP-01 challenges;
    # the ACME module answers /.well-known/acme-challenge/ itself.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;
        root /var/www/html;
        index index.html index.htm;

        # Answered for the image's HEALTHCHECK. Loopback only, so an empty web
        # root still reports healthy without exposing anything. Keep it if you
        # replace this file.
        location = /healthz {
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
            return 200;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # HTTPS with automatic certificates. Copy this into conf.d/ and set your
    # own server_name — see examples/tls.conf.example.
    #
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    #
    #     server_name example.com www.example.com;
    #     root /var/www/html;
    #
    #     acme_certificate letsencrypt;
    #     ssl_certificate     $acme_certificate;
    #     ssl_certificate_key $acme_certificate_key;
    #     # Do not re-parse the certificate on every request.
    #     ssl_certificate_cache max=2;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1h;
    #
    #     location / {
    #         try_files $uri $uri/ =404;
    #     }
    # }

    include /etc/nginx/conf.d/*.conf;
}
