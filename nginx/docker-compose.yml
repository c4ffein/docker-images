services:
  nginx:
    build:
      context: .
    image: nginx-acme:latest
    container_name: nginx-acme
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Web root
      - ./html:/var/www/html

      # Server blocks (see examples/tls.conf.example)
      - ./conf.d:/etc/nginx/conf.d:ro

      # ACME state: account key, issued certificates and their private keys.
      # This MUST be persisted, or every restart re-registers with the ACME
      # server and re-issues certificates, which burns rate limits fast.
      # The path matches `state_path` in nginx.conf.
      - nginx-acme-state:/var/nginx-acme

      # Uncomment to override the whole config instead of dropping files in conf.d
      # - ./nginx.conf:/etc/nginx/nginx.conf:ro

      # Logs already go to stdout/stderr; uncomment for files on disk
      # - ./logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - nginx-network

volumes:
  nginx-acme-state:
    driver: local

networks:
  nginx-network:
    driver: bridge
