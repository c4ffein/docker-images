# End-to-end ACME test against a local Pebble server.
#
# This file is a conf.d drop-in, so it is included by the *real* nginx.conf
# that ships in the image - unchanged. That is the point: if the shipped
# config, the module, or the base image drift apart, this test breaks.
#
# `acme_issuer` is valid in the http context, and conf.d is included inside
# http, so the test issuer can live here next to the servers that use it.

acme_issuer pebble {
    # Pebble on the test network, addressed by IP so no DNS is needed.
    uri https://10.30.50.2:14000/dir;
    # Pebble serves its API with a cert for "localhost" signed by its own test
    # CA, so verification cannot succeed. Test-only, never do this in prod.
    ssl_verify off;
    state_path /var/nginx-acme/pebble;
    accept_terms_of_service;
}

server {
    listen 80;
    # Pebble validates HTTP-01 on port 5002 by default rather than 80, so the
    # same server answers on both. The module serves /.well-known/acme-challenge/
    # itself, on whichever listener the request arrives.
    listen 5002;
    server_name e2e.test;

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name e2e.test;

    acme_certificate pebble;
    ssl_certificate     $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2;

    location / {
        default_type text/plain;
        return 200 "e2e ok\n";
    }
}
