# End-to-end ACME issuance test, fully offline.
#
#   pebble        ACME server (a real ACME implementation, not a mock)
#   challtestsrv  DNS that answers every query with nginx's address, so Pebble
#                 validates the challenge against our container
#   nginx         the image under test, running its shipped config
#
# Static addresses because Pebble needs to be reachable by IP from nginx before
# any DNS is configured. Run it with test/run-e2e.sh.

services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: -dnsserver 10.30.50.3:8053
    environment:
      # Skip Pebble's random 0-15s pause between validation attempts.
      - PEBBLE_VA_NOSLEEP=1
    networks:
      acmenet:
        ipv4_address: 10.30.50.2

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
    # Every name resolves to the nginx container.
    command: -defaultIPv6 "" -defaultIPv4 10.30.50.4
    networks:
      acmenet:
        ipv4_address: 10.30.50.3

  nginx:
    build:
      context: ..
    image: nginx-acme:latest
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
    ports:
      # Exposed so the test script can do the TLS handshake from the host.
      - "8443:443"
    networks:
      acmenet:
        ipv4_address: 10.30.50.4

networks:
  acmenet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.30.50.0/24
